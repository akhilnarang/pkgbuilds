name: AUR sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: aur-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Open PRs for changed AUR packages
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        run: |
          git config user.name "Akhil's Bot"
          git config user.email "jenkins@akhilnarang.dev"
          scripts/sync-aur.sh
